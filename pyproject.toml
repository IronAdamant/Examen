[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "examen"
version = "0.3.0"
description = "Examen: pass-by-reference notes for agent swarms. Not published on PyPI."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "IronAdamant"}]
keywords = ["agents", "llm", "notes", "swarm", "context"]
# The distribution name stays "examen" (the project name). Do not upload it:
# that name on PyPI is a different project. This classifier makes PyPI and
# twine reject an upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.urls]
Homepage = "https://github.com/IronAdamant/Examen"
Repository = "https://github.com/IronAdamant/Examen"

[project.optional-dependencies]
# Official MCP Python SDK (v2). Not imported by the core CLI. Needs Python >=3.10.
mcp = ["mcp>=2.0,<3"]

[project.scripts]
examen = "examen:main"
swarmnotes = "examen:main"
examen-mcp = "examen_mcp:main"

[tool.setuptools]
py-modules = ["examen", "examen_mcp"]
