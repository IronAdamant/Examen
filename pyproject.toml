[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "examen"
version = "0.2.0"
description = "Examen: pass-by-reference notes for agent swarms."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "IronAdamant"}]
keywords = ["agents", "llm", "notes", "swarm", "context"]
dependencies = []

[project.urls]
Homepage = "https://github.com/IronAdamant/Examen"
Repository = "https://github.com/IronAdamant/Examen"

[project.scripts]
examen = "examen:main"
swarmnotes = "examen:main"

[tool.setuptools]
py-modules = ["examen"]
