# Project name. This is the rename point for the crate, the `relatum` CLI,
# the `{name}-mcp` server binary, and the `{name}_*` MCP tools.
# `swarmnotes` stays as the legacy CLI alias. `publish` stays false so this
# crate is not sent to crates.io. npm packages live under npm/.
[package]
name = "relatum"
version = "1.3.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
publish = false
description = "Pass-by-reference notes for agent swarms. std only."
readme = "README.md"
autobins = false

[dependencies]

[dev-dependencies]

[[bin]]
name = "relatum"
path = "src/main.rs"

[[bin]]
name = "relatum-mcp"
path = "src/main.rs"

[[bin]]
name = "swarmnotes"
path = "src/main.rs"

# Parity tooling, std only. The frozen Python release on python-legacy is the
# reference oracle. Run with `cargo run --release --locked --example parity`.
[[example]]
name = "parity"
path = "parity/harness.rs"

[[example]]
name = "bench"
path = "parity/bench.rs"
# cargo test runs the peak-memory probe's own test.
test = true
