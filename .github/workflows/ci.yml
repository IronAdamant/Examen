name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust
        uses: dtolnay/rust-toolchain@1.83.0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the Python 0.3.0 branch
        run: git fetch origin python-legacy:python-legacy

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm pack and launcher
        shell: bash
        run: bash npm/pack-check.sh

      - name: MCP SDK for the parity server
        run: python -m pip install "mcp==2.3.0"

      - name: Parity
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          PARITY_PYTHON=python cargo run --release --locked --example parity -- "target/release/relatum${ext}" "target/release/relatum-mcp${ext}"
