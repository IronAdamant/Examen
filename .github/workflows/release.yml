# Builds release binaries and attaches them to a GitHub Release.
# Runs only on v* tags. Pull requests do not publish anything.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: relatum-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: relatum-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: relatum-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: relatum-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: relatum-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p "dist/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/relatum${ext}" \
             "target/${{ matrix.target }}/release/relatum-mcp${ext}" \
             "target/${{ matrix.target }}/release/swarmnotes${ext}" \
             "dist/${{ matrix.asset }}/"
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.sha256

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          notes="Relatum ${tag}. Verify SHA256SUMS before installing. Binaries: linux x64, linux arm64, macOS x64, macOS arm64, Windows x64. Each archive contains relatum, relatum-mcp, and the swarmnotes alias."
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --repo "$repo" --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS --repo "$repo" --title "$tag" --notes "$notes"
          fi
